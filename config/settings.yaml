# Configuration générale de Workstation Tooler

logging:
  level: INFO        # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: logs/workstation_tooler.log

update:
  check_interval_minutes: 60          # Fréquence de vérification des mises à jour des applications.
  app_check_interval_minutes: 240     # Fréquence de vérification de la mise à jour de l'application.
  retry_interval_minutes: 3           # Reprise accélérée tant qu'une ressource réseau est inaccessible.
  check_on_startup: true
  app_auto_restart: true              # Relance de l'application après une mise à jour d'elle-même.

# Forge source de l'application (version + déploiement de mise à jour de l'application).
# Voir docs/maj_application.md ; le token GitLab, lui, vit dans core/app_updater.py.
forge:
  provider: github              # github | gitlab
  github:
    branch: main
  gitlab:
    base_url: "https://gitlab.com"   # URL de l'instance GitLab (auto-hébergée ou gitlab.com)
    project_id: ""              # ID numérique du projet (page Projet > Détails)
    branch: main

# Chemin réseau unique hébergeant le catalogue des applications : un dossier par
# application, contenant un app.yaml (métadonnées) et un dossier par version
# avec son manifest.yaml (fichiers et actions). Voir docs/moteur_mise_a_jour.md.
# Accès SMB avec la session de l'utilisateur du poste (poste joint au domaine
# Active Directory, droits de lecture requis sur le partage). Modes : session
# (défaut) | credentials (user + mot de passe en variable d'environnement
# WORKSTATION_TOOLER_SMB_PASSWORD) | guest (partage public de dev/test).
repository:
  uri: "smb://SERVEUR.DOMAINE/Workstation_Tooler"   # À remplacer par le partage AD réel. file:///chemin/local accepté (dev, tests).
  auth: "session"
  username: ""           # Utilisé uniquement en modes credentials et guest.
  domain: ""
  timeout_seconds: 30

github:
  repository: "pderouet/Workstation_Tooler"

ui:
  show_notifications: true
